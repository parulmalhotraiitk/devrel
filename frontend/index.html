<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevRel Empire | AI Content Orchestration</title>
    <meta name="description" content="AI-powered content orchestration platform for developer relations teams." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div id="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="logo">
          <span class="logo-icon"><i data-lucide="layers" style="color: var(--primary);"></i></span>
          <div>
            <div class="logo-text">DevRel Empire</div>
            <div class="logo-sub">AI Content Studio</div>
          </div>
        </div>

        <nav>
          <div class="nav-section-label">Overview</div>
          <button class="nav-item active" data-view="dashboard">
            <span class="icon"><i data-lucide="layout-dashboard"></i></span> Dashboard
          </button>

          <div class="nav-section-label">Configuration</div>
          <button class="nav-item" data-view="settings">
            <span class="icon"><i data-lucide="key-round"></i></span> API Keys
          </button>
          <button class="nav-item" data-view="integration">
            <span class="icon"><i data-lucide="plug"></i></span> Integration
          </button>

          <div class="nav-section-label">Support</div>
          <button class="nav-item" data-view="faq">
            <span class="icon"><i data-lucide="help-circle"></i></span> FAQ
          </button>
        </nav>

        <div class="sidebar-footer">
          <div style="display:flex;align-items:center;gap:0.4rem;margin-bottom:0.3rem;">
            <span style="width:7px;height:7px;border-radius:50%;background:#4CAF50;box-shadow:0 0 5px #4CAF50;display:inline-block;"></span>
            <span>Service Online</span>
          </div>
          v1.2.0 · Cloud Run
        </div>
      </aside>

      <!-- Main Content -->
      <main class="content">
        <header class="top-bar">
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <h1 id="view-title">Dashboard</h1>
          </div>
          <div class="user-profile">
            <button class="theme-toggle" id="theme-toggle" title="Toggle theme">🌙 Dark</button>
            <span class="status-dot online"></span>
            <span>Admin</span>
          </div>
        </header>

        <section id="view-container" class="glass-panel"></section>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
